name: Claude auth check

# Run by hand after setting or rotating CLAUDE_CODE_OAUTH_TOKEN. Prints only whether a one-line
# Claude call succeeded and its short reply or error message; never the token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Token shape (length and prefix only)
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          trimmed=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "length=${#T} trimmed_length=${#trimmed} prefix=${trimmed:0:13} has_whitespace=$([ "${#T}" != "${#trimmed}" ] && echo yes || echo no)"
      - name: One-line Claude call
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          out=$(claude -p "Reply with the single word OK." --model sonnet --output-format json --max-turns 1 2>&1 || true)
          echo "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s.slice(s.indexOf("{")));console.log(JSON.stringify({is_error:j.is_error,subtype:j.subtype,result:String(j.result||"").slice(0,300)}))}catch{console.log(s.replace(/sk-ant-[A-Za-z0-9_-]+/g,"[redacted]").slice(0,600))}})'
