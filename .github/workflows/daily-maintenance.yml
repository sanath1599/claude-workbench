name: Daily maintenance

# Every day: check tracked package versions, vulnerabilities (OSV), links, MCP endpoints, stale facts and
# Claude Code releases. If anything needs attention, a Claude run (sonnet, web search, the owner's OAuth
# token) updates the skills on a branch and opens a PR. High/critical vulnerabilities are emailed via Resend.
on:
  schedule:
    - cron: "0 3 * * *" # 07:00 Asia/Dubai
  workflow_dispatch:
    inputs:
      force_claude:
        description: "Run the Claude step even if the report is clean"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL || 'owner@example.com' }}
      ALERT_FROM: ${{ vars.ALERT_FROM || 'Workbench <workbench@antm.ai>' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Collect report
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary=$(node maintenance/collect.mjs)
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          case "$summary" in *needs_attention=true*) echo "attention=true" >> "$GITHUB_OUTPUT";; *) echo "attention=false" >> "$GITHUB_OUTPUT";; esac
          case "$summary" in *major=0*) echo "major=false" >> "$GITHUB_OUTPUT";; *) echo "major=true" >> "$GITHUB_OUTPUT";; esac
          cat maintenance/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-report
          path: maintenance/out/

      - name: Prepare branch
        if: steps.collect.outputs.attention == 'true' || inputs.force_claude
        run: |
          git config user.name "workbench-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "maintenance/$(date -u +%F)"

      - name: Install Claude Code CLI (for plugin validation inside the run)
        if: steps.collect.outputs.attention == 'true' || inputs.force_claude
        run: npm install -g @anthropic-ai/claude-code

      - name: Update skills with Claude
        if: steps.collect.outputs.attention == 'true' || inputs.force_claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow maintenance/PROMPT.md exactly. Today's report is in maintenance/out/report.md and report.json.
          claude_args: >-
            --model sonnet
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm test:*),Bash(node:*),Bash(claude plugin validate:*),Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(gh api:*)"

      - name: Open PR
        id: pr
        if: steps.collect.outputs.attention == 'true' || inputs.force_claude
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "No changes committed."; exit 0; fi
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Maintenance $(date -u +%F)" --body-file maintenance/out/report.md --label maintenance 2>/dev/null || gh pr create --base main --head "$branch" --title "Maintenance $(date -u +%F)" --body-file maintenance/out/report.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Validate and approve the PR
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.url }}
        run: bash maintenance/validate-pr.sh

      - name: Email high/critical vulnerabilities
        if: steps.collect.outputs.major == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PR_URL: ${{ steps.pr.outputs.url }}
          DIGEST: ${{ vars.EMAIL_DIGEST || 'false' }}
        run: node maintenance/notify.mjs
